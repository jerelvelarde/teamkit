services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: teamkit
      POSTGRES_DB: teamkit
      POSTGRES_HOST_AUTH_METHOD: trust
    command: postgres -c max_connections=500
    volumes:
      - teamkit-pg:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://teamkit@postgres:5432/teamkit
      TEAMKIT_PUBLIC_URL: http://localhost:3000
      TEAMKIT_SMTP_URL: ${TEAMKIT_SMTP_URL:-}
      TEAMKIT_MAIL_FROM: ${TEAMKIT_MAIL_FROM:-}
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - postgres
    # postgres has no healthcheck; the server migrates on start, so retry until it accepts connections
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      TEAMKIT_SERVER_URL: http://server:8787
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - server

volumes:
  teamkit-pg:
