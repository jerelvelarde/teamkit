services:
  postgres:
    image: postgres:17
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: teamkit
      POSTGRES_DB: teamkit
      POSTGRES_HOST_AUTH_METHOD: trust
    command: postgres -c max_connections=500
    volumes:
      - teamkit-pg:/var/lib/postgresql/data

volumes:
  teamkit-pg:
